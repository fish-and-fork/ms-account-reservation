spring:
  application:
    name: ${APP_NAME}
  datasource:
    password: ${DB_PASSWORD}
    username: ${DB_USER}
    url: ${DB_URL}
    driver-class-name: ${DB_DRIVER}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
    enabled: true
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: ${APP_PORT}
  servlet:
    context-path: /api/v1
management:
  server:
    port: ${MANAGEMENT_PORT}
  endpoints:
    web:
      exposure:
        include: health, threaddump
logging:
  level:
    org:
      springframework:
        web: DEBUG
        security: DEBUG
      hibernate:
        SQL: DEBUG
springdoc:
  api-docs:
    enabled: false # отключает автоматическую генерацию из аннотаций, т.к. источник - yaml
  swagger-ui:
    url: /ms-upgrade-api.yaml